; Конфигурация по умолчанию: ./run.sh читает этот файл.
[settings]
; Имя анализируемого пакета npm
package = express
; URL репозитория пакетов (или путь к файлу при test_mode = true)
repository = https://registry.npmjs.org
; Режим работы с тестовым репозиторием: true или false
test_mode = false
; Имя файла с изображением графа
output = graph.svg
; Подстрока: пакеты, в имени которых она есть, не анализируются
filter =
